<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Publish Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        h2 {
            color: #007bff;
            margin: 10px 0;
        }

        div {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        p {
            margin: 5px 0;
            line-height: 1.6;
        }

        strong {
            color: #333;
        }

        ul {
            padding-left: 20px;
            margin: 5px 0;
        }

        li {
            background: #e9ecef;
            border-radius: 4px;
            padding: 5px;
            margin: 5px 0;
        }

        hr {
            border: 1px solid #ddd;
            margin: 20px 0;
        }
    </style>
</head>
<body>
<h1>Publish Details</h1>

<div th:each="publish : ${publishList}">
    <h2>Details for Email: <span th:text="${publish.email}"></span></h2>
    <p><strong>Date:</strong> <span th:text="${#dates.format(publish.date, 'yyyy-MM-dd')}"></span></p>
    <p><strong>Locations:</strong></p>
    <ul>
        <li th:each="location : ${publish.locations}" th:text="${location}"></li>
    </ul>
    <p><strong>Amount:</strong> <span th:text="${publish.amount}"></span></p>
    <p><strong>Message:</strong> <span th:text="${publish.message}"></span></p>
    <p><strong>Seats:</strong> <span th:text="${publish.seats}"></span></p>
    <hr/>
</div>
</body>
</html>
